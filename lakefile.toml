name = "LTEL"
version = "0.1.0"
defaultTargets = ["LTEL"]

# Mathlib pinned to the release matching lean-toolchain v4.30.0.
# The structural proofs (T1, L2, semantics, Q3 counterexample) remain
# Mathlib-free; Mathlib is imported only in modules that need finite
# pigeonhole / cardinality machinery (the L3 lasso/small-model proof).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "LTEL"
